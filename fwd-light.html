<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Falling weight deflectometer</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(720px,100% - 32px);margin:64px auto 96px}

    `<path class="iso-line" data-tone="lo" d="${c.back}"/>` +
    solidSvg(cylinder(x, PLATE_Y, 0.6, top, SLEEVE_Z[0] - top, P, 12), { tone: "mid", crease: "none" }) +
    `<path class="iso-line" data-tone="mid" d="${c.front}"/>`
  );
};
const chartU = (mils) => CHART.x0 + mils * CHART.perMil - CAB.x;
const chartV = (kip) => CAB_Z[1] - (CHART.z0 + kip * CHART.perKip);
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const part = (name) => svg.querySelector('[data-part="' + name + '"]');
const keysOf = (el) => Object.fromEntries([...el.querySelectorAll("[data-k]")].map((node) => [node.dataset.k, node]));
const LAYERS = ["approach", "leave", "base", "sub"];
const nodes = Object.fromEntries(LAYERS.map((name) => [name, keysOf(part(name))]));
const cavity = part("cavity");
const dotLists = {
  aggA: [...nodes.approach.agg.children],
  aggL: [...nodes.leave.agg.children],
  aggEnd: [...nodes.leave.aggEnd.children],
  grain: [...nodes.base.grain.children],
  soil: [...nodes.sub.soil.children],
};
const geos = [...svg.querySelectorAll('[data-part="geo"]')].map((el) => ({ x: +el.dataset.x, body: el.querySelector('[data-k="body"]'), spring: el.querySelector('[data-k="spring"]'), at: 0 }));
const el = Object.fromEntries(["plate", "buf-back", "buf-front", "shaft-low", "shaft-mid", "shaft-high", "weight", "lug-front", "hook-back", "hook-front", "yoke", "rod", "pen-arm", "pen", "marks", "load", "d0"].map((name) => [name, part(name)]));
const marks = keysOf(el.marks);
const readout = document.querySelector("[data-readout]");
const announcer = document.querySelector('[data-part="announce"]');
const still = matchMedia("(prefers-reduced-motion: reduce)");
const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
const move = (node, by) => {
  const text = translateAlong(P, by);
  if (node.getAttribute("transform") !== text) node.setAttribute("transform", text);
};
const setHtml = (node, html) => {
  if (node.__html !== html) {
    node.innerHTML = html;
    node.__html = html;
  }
};

// ---- What is on screen ----
let pavementKey = "";
function drawPavement(L) {
  const key = L.kip.toFixed(3) + "|" + L.g.toFixed(3);
  if (key === pavementKey) return;
  pavementKey = key;
  const shapes = pavementOf(L, P);
  for (const name of LAYERS) {
    const shape = shapes[name];
    const n = nodes[name];
    for (const k2 of ["fill", "front", "end", "top", "tine", "crease", "edge", "joint"]) if (n[k2] && shape[k2] !== undefined) n[k2].setAttribute("d", shape[k2]);
  }
  cavity.setAttribute("d", shapes.cavity);
  for (const [name, list] of Object.entries(dotLists)) {
    const points = shapes.dots[name];
    list.forEach((dot, index) => {
      dot.setAttribute("cx", points[index][0].toFixed(1));
      dot.setAttribute("cy", points[index][1].toFixed(1));
    });
  }
}

const IDLE_TEST = testOf(0);
const IDLE_PLAN = scheduleOf(IDLE_TEST);
const pen = { at: PEN_HOME };

function drawRig(pose, g) {
  const L = loadOf(pose.kip, g);
  drawPavement(L);
  const dip = deflectionAt(L, PLATE_AT[0], PLATE_AT[1]) * MIL;
  move(el.plate, [0, 0, -dip]);
  setHtml(el["buf-back"], buffersAt(pose.wz, CAP_TOP - dip, BACK_BUF));
  setHtml(el["buf-front"], buffersAt(pose.wz, CAP_TOP - dip, FRONT_BUF));
  move(el.weight, [0, 0, pose.wz - W_REST]);
  move(el["lug-front"], [0, 0, pose.wz - W_REST]);
  setHtml(el["shaft-low"], shaftSeg(SHAFT_FOOT, pose.wz));
  setHtml(el["shaft-mid"], shaftSeg(pose.wz + W_H, pose.yoke - 0.6));
  setHtml(el["shaft-high"], shaftSeg(pose.yoke + YOKE_H + 0.6, CH_Z[0]));
  move(el.yoke, [0, 0, pose.yoke - PARK]);
  move(el["hook-back"], [2 * pose.open, 0, pose.yoke - PARK]);
  move(el["hook-front"], [2 * pose.open, 0, pose.yoke - PARK]);
  setHtml(el.rod, rodSeg(pose.yoke + YOKE_H));
  for (const geo of geos) {
    const d = deflectionAt(L, geo.x / IN, PLATE_AT[1]) * MIL;
    if (Math.abs(d - geo.at) < 0.005) continue;
    geo.at = d;
    move(geo.body, [0, 0, -d]);
    geo.spring.innerHTML = geoMoving(geo.x, d);
  }
  return dip;
}

function drawChart(chart, pose, calm, dt) {
  // The pen follows the pose closely; a new sheet's pen glides home instead of jumping.
  const goal = pose.pen;
  pen.at = calm ? goal : [pen.at[0] + (goal[0] - pen.at[0]) * (1 - Math.exp(-dt / 0.05)), pen.at[1] + (goal[1] - pen.at[1]) * (1 - Math.exp(-dt / 0.05))];
  if (Math.hypot(goal[0] - pen.at[0], goal[1] - pen.at[1]) < 0.01) pen.at = goal;
  move(el["pen-arm"], [pen.at[0] * CHART.perMil, 0, 0]);
  move(el.pen, [pen.at[0] * CHART.perMil, 0, pen.at[1] * CHART.perKip]);
  const test = chart ? chart.test : IDLE_TEST;
  test.drops.forEach((drop, index) => {
    const dot = marks["dot" + index];
    const shown = chart && pose.dots > index;
    dot.style.opacity = shown ? "1" : "0";
    dot.setAttribute("cx", chartU(drop.d0).toFixed(2));
    dot.setAttribute("cy", chartV(drop.kip).toFixed(2));
  });
  let ruled = "";
  let reach = "";
  if (chart && pose.line > 0) {
    const low = LOADS[0];
    const kipNow = TOP_KIP * (1 - pose.line);
    const point = (kip) => chartU(test.fit.zero + test.fit.slope * kip).toFixed(2) + " " + chartV(kip).toFixed(2);
    ruled = "M" + point(TOP_KIP) + "L" + point(Math.max(kipNow, low));
    if (kipNow < low) reach = "M" + point(low) + "L" + point(kipNow);
  }
  if (marks.ruled.getAttribute("d") !== ruled) marks.ruled.setAttribute("d", ruled);
  if (marks.reach.getAttribute("d") !== reach) marks.reach.setAttribute("d", reach);
  marks.zero.style.opacity = chart && pose.line >= 1 ? "1" : "0";
  marks.zero.setAttribute("cx", chartU(test.fit.zero).toFixed(2));
  marks.zero.setAttribute("cy", chartV(0).toFixed(2));
  el.marks.style.opacity = chart && chart.stale ? "0.3" : "1";
}

function windowsOf(chart, pose, dip) {
  if (!chart) return ["0.0", "0.0"];
  if (pose.phase === "pulse") return [pose.kip.toFixed(1), (dip / MIL).toFixed(1)];
  const done = chart.plan.pulses.filter((s) => s.t1 <= chart.t).length;
  if (!done) return ["0.0", "0.0"];
  const drop = chart.test.drops[done - 1];
  return [drop.kip.toFixed(1), drop.d0.toFixed(1)];
}

const mils = (value) => value.toFixed(1) + (Math.abs(value - 1) < 0.05 ? " mil" : " mils");
function readoutOf(chart, pose, g, dip) {
  if (!chart || chart.stale) return g < 0.05 ? "full support · click to test" : "void " + mils(g) + " · click to test";
  const i = pose.drop;
  if (pose.phase === "verdict") return "zero load " + mils(chart.test.fit.zero) + " · " + (chart.test.void ? "void" : "supported");
  if (pose.phase === "rule") return "ruling the line to zero load";
  if (pose.phase === "reach") return "catching the weight";
  if (pose.phase === "lift") return "drop " + (i + 1) + " · lifting to " + heightIn(LOADS[i]).toFixed(1) + " in";
  if (pose.phase === "fall") return "drop " + (i + 1) + " · falling";
  if (pose.phase === "pulse") return "drop " + (i + 1) + " · " + pose.kip.toFixed(1) + " kip · " + mils(dip / MIL);
  const done = chart.plan.pulses.filter((s) => s.t1 <= chart.t).length;
  if (done) {
    const drop = chart.test.drops[done - 1];
    return "drop " + done + " · " + drop.kip.toFixed(1) + " kip · " + mils(drop.d0);
  }
  return "catching the weight";
}

// ---- State ----
const voidShown = { x: 0, v: 0 };
let voidTarget = 0;
let run = null;
let chart = null;
let hurry = false;
let pendingVoid = null;
let frame = 0;
let last = 0;
let visible = false;
let touring = !still.matches;
let tour = { step: 0, clock: -1.4, phase: "set" };
let idleTimer = 0;
let lastAnnounced = "";
const TOUR = [0, 7];

const describe = () => {
  const now = "Void under the leave corner: " + voidTarget.toFixed(1) + " mils.";
  const result = chart && !chart.stale && chart.t >= chart.plan.end ? " Last test: the line meets zero load at " + chart.test.fit.zero.toFixed(1) + " mils, " + (chart.test.void ? "a void." : "the corner is supported.") : "";
  stage.setAttribute("aria-valuenow", voidTarget.toFixed(1));
  stage.setAttribute("aria-valuetext", now + result);
};
const say = (text) => {
  if (text === lastAnnounced) return;
  lastAnnounced = text;
  announcer.textContent = text;
};

function settleVoid(dt, calm) {
  if (calm) {
    voidShown.x = voidTarget;
    voidShown.v = 0;
    return false;
  }
  const w = 1 / 0.35;
  for (let step = 0; step < 4; step++) {
    const h = dt / 4;
    voidShown.v += (w * w * (voidTarget - voidShown.x) - 2 * w * voidShown.v) * h;
    voidShown.x += voidShown.v * h;
  }
  if (Math.abs(voidTarget - voidShown.x) < 1e-3 && Math.abs(voidShown.v) < 1e-3) {
    voidShown.x = voidTarget;
    voidShown.v = 0;
    return false;
  }
  return true;
}

function setVoid(g) {
  g = clamp(Math.round(g * 2) / 2, 0, VOID_MAX);
  if (run) {
    pendingVoid = g;
    hurry = true;
    return;
  }
  if (g === voidTarget) return;
  voidTarget = g;
  if (chart) chart.stale = true;
  describe();
  kick();
}

function startRun() {
  if (run) return;
  voidShown.x = voidTarget;
  voidShown.v = 0;
  const test = testOf(voidTarget);
  run = { test, plan: scheduleOf(test), t: 0, stale: false };
  chart = run;
  say("Testing: three drops at 9, 12 and 16 kip.");
  if (still.matches) run.t = run.plan.end;
  kick();
}

function finishRun() {
  run.t = run.plan.end;
  run = null;
  hurry = false;
  say("The line meets zero load at " + chart.test.fit.zero.toFixed(1) + " mils: " + (chart.test.void ? "a void under the corner." : "the corner is supported."));
  describe();
  if (pendingVoid !== null) {
    const g = pendingVoid;
    pendingVoid = null;
    setVoid(g);
  }
}

function tourStep(dt) {
  tour.clock += dt;
  if (tour.phase === "set" && tour.clock >= 0) {
    setVoid(TOUR[tour.step]);
    tour.phase = "wait";
    tour.clock = 0;
  } else if (tour.phase === "wait" && tour.clock >= 1.8) {
    startRun();
    tour.phase = "run";
  } else if (tour.phase === "run" && !run) {
    tour.phase = "hold";
    tour.clock = 0;
  } else if (tour.phase === "hold" && tour.clock >= 3.6) {
    tour.step = (tour.step + 1) % TOUR.length;
    tour.phase = "set";
    tour.clock = 0;
  }
}

function render(dt, calm) {
  const active = chart ?? null;
  const pose = active ? poseAt(active.t, active.test, active.plan) : poseAt(0, IDLE_TEST, IDLE_PLAN);
  const g = run ? run.test.g : voidShown.x;
  const dip = drawRig(pose, g);
  drawChart(active, pose, calm, dt);
  const [load, d0] = windowsOf(active, pose, dip);
  if (el.load.textContent !== load) el.load.textContent = load;
  if (el.d0.textContent !== d0) el.d0.textContent = d0;
  const text = readoutOf(active, pose, voidTarget, dip);
  if (readout.textContent !== text) readout.textContent = text;
  return pen.at[0] !== pose.pen[0] || pen.at[1] !== pose.pen[1];
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring && !calm) tourStep(dt);
  let busy = false;
  if (run) {
    run.t += dt * (hurry ? 5 : 1);
    if (run.t >= run.plan.end) finishRun();
    busy = true;
  }
  if (!run && settleVoid(dt, calm)) busy = true;
  if (render(dt, calm)) busy = true;
  frame = visible && (busy || (touring && !calm)) ? requestAnimationFrame(tick) : 0;
}
function kick() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
function hold() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (still.matches) return;
    touring = true;
    tour = { step: (tour.step + 1) % TOUR.length, clock: 0, phase: run ? "run" : "set" };
    kick();
  }, 3600);
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) kick();
}, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("pointermove", (event) => {
  if (event.pointerType !== "mouse") return;
  hold();
  const box = svg.getBoundingClientRect();
  const share = clamp(((event.clientX - box.left) / box.width - 0.18) / 0.64, 0, 1);
  setVoid(share * VOID_MAX);
});
stage.addEventListener("click", () => {
  hold();
  startRun();
});
stage.addEventListener("keydown", (event) => {
  const step = event.shiftKey ? 2.5 : 1;
  let next = null;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") next = voidTarget + step;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") next = voidTarget - step;
  if (event.key === "Home") next = 0;
  if (event.key === "End") next = VOID_MAX;
  if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    hold();
    startRun();
    return;
  }
  if (next === null) return;
  event.preventDefault();
  hold();
  setVoid(pendingVoid !== null ? next - voidTarget + pendingVoid : next);
});
stage.addEventListener("focus", () => {
  describe();
  say(readout.textContent);
});
describe();
render(1 / 60, true);

</script></body></html>
